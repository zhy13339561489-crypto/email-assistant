<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .report {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h1 {
            color: #1a1a1a;
            font-size: 24px;
            border-bottom: 3px solid #4CAF50;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }
        .content {
            font-size: 15px;
            line-height: 1.8;
            color: #333;
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="report">
            <h1>{{title}}</h1>
            <div class="content">{{content}}</div>
        </div>
        <div class="footer">Email AI 自动整理工具 - 由 ChatGPT 驱动</div>
    </div>
</body>
</html>
